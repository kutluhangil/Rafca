<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="auto">
  <defs>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9963F" />
      <stop offset="100%" stop-color="#F5BD62" />
    </linearGradient>
    <style>
      @keyframes flowDot {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(840px); opacity: 0; }
      }
      .flowing-dot {
        animation: flowDot 3.5s linear infinite;
      }
      .mono-txt {
        font-family: 'IBM Plex Mono', monospace;
        letter-spacing: 0.08em;
      }
      .sans-txt {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </defs>

  <rect width="1000" height="240" rx="12" fill="#151311" stroke="#3A332A" stroke-width="1" />

  <!-- Flow connecting wire -->
  <line x1="80" y1="120" x2="920" y2="120" stroke="#3A332A" stroke-width="2" stroke-dasharray="4 4" />
  <circle class="flowing-dot" cx="80" cy="120" r="4" fill="#F5BD62" />

  <!-- Step 1: Capture & Leveling -->
  <g transform="translate(60, 40)">
    <rect width="160" height="160" rx="10" fill="#1C1916" stroke="#4F4537" stroke-width="1" />
    <circle cx="80" cy="50" r="24" fill="#221F1D" stroke="#C9963F" stroke-width="1" />
    <path d="M72 46 h16 v10 h-16 z" fill="#C9963F" />
    <text x="80" y="105" text-anchor="middle" fill="#F4EFE6" font-size="13" font-weight="600" class="sans-txt">1. Canlı Yakalama</text>
    <text x="80" y="125" text-anchor="middle" fill="#A79C8C" font-size="10" class="mono-txt">±7° Tesviye</text>
    <text x="80" y="142" text-anchor="middle" fill="#6E8F6A" font-size="9" class="mono-txt">camera + sensors</text>
  </g>

  <!-- Step 2: Quad Warp -->
  <g transform="translate(260, 40)">
    <rect width="160" height="160" rx="10" fill="#1C1916" stroke="#4F4537" stroke-width="1" />
    <circle cx="80" cy="50" r="24" fill="#221F1D" stroke="#C9963F" stroke-width="1" />
    <polygon points="70,42 92,45 88,60 68,58" fill="none" stroke="#F5BD62" stroke-width="1.5" />
    <text x="80" y="105" text-anchor="middle" fill="#F4EFE6" font-size="13" font-weight="600" class="sans-txt">2. Kadraj &amp; Warp</text>
    <text x="80" y="125" text-anchor="middle" fill="#A79C8C" font-size="10" class="mono-txt">Bilinear Inverse</text>
    <text x="80" y="142" text-anchor="middle" fill="#6E8F6A" font-size="9" class="mono-txt">image (Dart)</text>
  </g>

  <!-- Step 3: 4-Way OCR & Clustering -->
  <g transform="translate(460, 40)">
    <rect width="160" height="160" rx="10" fill="#1C1916" stroke="#C9963F" stroke-width="1.5" />
    <circle cx="80" cy="50" r="24" fill="#262119" stroke="#F5BD62" stroke-width="1" />
    <text x="80" y="55" text-anchor="middle" fill="#F5BD62" font-size="11" font-weight="700" class="mono-txt">0-270°</text>
    <text x="80" y="105" text-anchor="middle" fill="#F4EFE6" font-size="13" font-weight="600" class="sans-txt">3. OCR &amp; Kümeleme</text>
    <text x="80" y="125" text-anchor="middle" fill="#A79C8C" font-size="10" class="mono-txt">Otsu / 1B Split</text>
    <text x="80" y="142" text-anchor="middle" fill="#6E8F6A" font-size="9" class="mono-txt">spine_clustering</text>
  </g>

  <!-- Step 4: Trigram Matching -->
  <g transform="translate(660, 40)">
    <rect width="160" height="160" rx="10" fill="#1C1916" stroke="#4F4537" stroke-width="1" />
    <circle cx="80" cy="50" r="24" fill="#221F1D" stroke="#C9963F" stroke-width="1" />
    <text x="80" y="55" text-anchor="middle" fill="#C9963F" font-size="11" class="mono-txt">3-GRAM</text>
    <text x="80" y="105" text-anchor="middle" fill="#F4EFE6" font-size="13" font-weight="600" class="sans-txt">4. Skor &amp; Eşleme</text>
    <text x="80" y="125" text-anchor="middle" fill="#A79C8C" font-size="10" class="mono-txt">pg_trgm + FTS</text>
    <text x="80" y="142" text-anchor="middle" fill="#6E8F6A" font-size="9" class="mono-txt">Go matchd</text>
  </g>

  <!-- Step 5: Digital Library -->
  <g transform="translate(860, 40)">
    <rect width="90" height="160" rx="10" fill="#262119" stroke="#6E8F6A" stroke-width="1" />
    <text x="45" y="70" text-anchor="middle" fill="#6E8F6A" font-size="20">📚</text>
    <text x="45" y="105" text-anchor="middle" fill="#F4EFE6" font-size="11" font-weight="600" class="sans-txt">Dijital Raf</text>
    <text x="45" y="125" text-anchor="middle" fill="#6E8F6A" font-size="9" class="mono-txt">Drift DB</text>
  </g>
</svg>
