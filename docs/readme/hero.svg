<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12100E" />
      <stop offset="50%" stop-color="#1C1916" />
      <stop offset="100%" stop-color="#12100E" />
    </linearGradient>

    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9963F" />
      <stop offset="50%" stop-color="#F5BD62" />
      <stop offset="100%" stop-color="#C9963F" />
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9963F" stop-opacity="0" />
      <stop offset="50%" stop-color="#F5BD62" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C9963F" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes scanPulse {
        0% { transform: translateY(0px); opacity: 0.1; }
        50% { transform: translateY(180px); opacity: 0.85; }
        100% { transform: translateY(0px); opacity: 0.1; }
      }
      @keyframes spineEnter {
        0% { transform: scaleY(0.2); }
        50% { transform: scaleY(1.0); }
        100% { transform: scaleY(0.85); }
      }
      @keyframes goldFlicker {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.8; }
      }
      .laser {
        animation: scanPulse 4.5s ease-in-out infinite;
      }
      .brass-text {
        fill: url(#brassGrad);
        filter: drop-shadow(0 0 12px rgba(201, 150, 63, 0.35));
      }
      .mono {
        font-family: 'IBM Plex Mono', 'SF Pro Text', Menlo, monospace;
        letter-spacing: 0.14em;
      }
      .serif {
        font-family: 'Literata', Georgia, serif;
      }
      .spine-bar {
        transform-origin: bottom;
        animation: spineEnter 3s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="440" rx="16" fill="url(#bgGrad)" stroke="#3A332A" stroke-width="1.5" />

  <!-- Background Archival Grid Pattern -->
  <g opacity="0.07" stroke="#F4EFE6" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="440" />
    <line x1="300" y1="0" x2="300" y2="440" />
    <line x1="500" y1="0" x2="500" y2="440" />
    <line x1="700" y1="0" x2="700" y2="440" />
    <line x1="900" y1="0" x2="900" y2="440" />
    <line x1="1100" y1="0" x2="1100" y2="440" />
    <line x1="0" y1="110" x2="1200" y2="110" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="330" x2="1200" y2="330" />
  </g>

  <!-- Top Metadata Bar -->
  <g transform="translate(60, 48)">
    <circle cx="6" cy="6" r="4" fill="#6E8F6A" />
    <text x="22" y="10" fill="#A79C8C" font-size="12" class="mono" font-weight="600">SYS_STATUS: OPTICAL PIPELINE OPERATIONAL</text>
    <text x="960" y="10" fill="#C9963F" font-size="12" class="mono" font-weight="600">BUILD: v1.0.0-FAZ6</text>
  </g>

  <!-- Main Title Area -->
  <g transform="translate(60, 140)">
    <text x="0" y="0" font-size="64" font-weight="700" class="serif brass-text" letter-spacing="-0.02em">Rafça</text>
    <text x="210" y="-8" font-size="13" class="mono" fill="#A79C8C" font-weight="600">/ NOCTURNAL ARCHIVIST</text>

    <text x="0" y="44" font-size="20" fill="#F4EFE6" font-family="'Inter', -apple-system, sans-serif" font-weight="300" opacity="0.9">
      Fiziksel kütüphaneyi 10 saniyede dijitalleştiren mobil raf tarayıcı.
    </text>
    <text x="0" y="74" font-size="14" fill="#A79C8C" font-family="'Inter', -apple-system, sans-serif">
      Cihaz-içi 4 yönlü OCR • Saf Dart sırt kümeleme • Trigram katalog eşleme • Yerel-önce mimari
    </text>
  </g>

  <!-- Animated ShelfStrip Simulator Graphic -->
  <g transform="translate(60, 275)">
    <!-- Shelf Base -->
    <rect x="0" y="96" width="1080" height="4" fill="#3A332A" rx="2" />
    <rect x="0" y="94" width="1080" height="1" fill="#C9963F" opacity="0.6" />

    <!-- Simulated Book Spines (ShelfStrip) -->
    <!-- Spine 1 -->
    <rect class="spine-bar" style="animation-delay: 0.1s" x="40" y="10" width="34" height="86" rx="4" fill="#304E2E" stroke="#4F4537" stroke-width="1" />
    <!-- Spine 2 -->
    <rect class="spine-bar" style="animation-delay: 0.25s" x="80" y="4" width="48" height="92" rx="4" fill="#8A5A00" stroke="#4F4537" stroke-width="1" />
    <!-- Spine 3 -->
    <rect class="spine-bar" style="animation-delay: 0.15s" x="134" y="16" width="28" height="80" rx="4" fill="#2C2927" stroke="#C9963F" stroke-width="1" />
    <!-- Spine 4 (Matched Gold) -->
    <rect class="spine-bar" style="animation-delay: 0.3s" x="168" y="0" width="56" height="96" rx="4" fill="#C9963F" opacity="0.85" stroke="#F5BD62" stroke-width="1" />
    <!-- Spine 5 -->
    <rect class="spine-bar" style="animation-delay: 0.05s" x="230" y="12" width="32" height="84" rx="4" fill="#373432" stroke="#4F4537" stroke-width="1" />
    <!-- Spine 6 -->
    <rect class="spine-bar" style="animation-delay: 0.2s" x="268" y="8" width="42" height="88" rx="4" fill="#1D1B19" stroke="#4F4537" stroke-width="1" />
    <!-- Spine 7 -->
    <rect class="spine-bar" style="animation-delay: 0.35s" x="316" y="2" width="50" height="94" rx="4" fill="#6E8F6A" opacity="0.7" stroke="#ADD0A7" stroke-width="1" />
    <!-- Spine 8 -->
    <rect class="spine-bar" style="animation-delay: 0.1s" x="372" y="18" width="26" height="78" rx="4" fill="#221F1D" stroke="#4F4537" stroke-width="1" />
    <!-- Spine 9 -->
    <rect class="spine-bar" style="animation-delay: 0.4s" x="404" y="6" width="44" height="90" rx="4" fill="#DE8B4E" opacity="0.8" stroke="#FFB785" stroke-width="1" />
    <!-- Spine 10 -->
    <rect class="spine-bar" style="animation-delay: 0.18s" x="454" y="14" width="36" height="82" rx="4" fill="#3A332A" stroke="#4F4537" stroke-width="1" />
    <!-- Spine 11 -->
    <rect class="spine-bar" style="animation-delay: 0.28s" x="496" y="0" width="54" height="96" rx="4" fill="#C9963F" stroke="#F5BD62" stroke-width="1" />
    <!-- Spine 12..20 placeholders -->
    <rect class="spine-bar" style="animation-delay: 0.12s" x="556" y="8" width="38" height="88" rx="4" fill="#304E2E" stroke="#4F4537" stroke-width="1" />
    <rect class="spine-bar" style="animation-delay: 0.32s" x="600" y="4" width="46" height="92" rx="4" fill="#1D1B19" stroke="#4F4537" stroke-width="1" />
    <rect class="spine-bar" style="animation-delay: 0.08s" x="652" y="16" width="30" height="80" rx="4" fill="#2C2927" stroke="#4F4537" stroke-width="1" />
    <rect class="spine-bar" style="animation-delay: 0.22s" x="688" y="10" width="42" height="86" rx="4" fill="#8A5A00" stroke="#4F4537" stroke-width="1" />
    <rect class="spine-bar" style="animation-delay: 0.38s" x="736" y="0" width="52" height="96" rx="4" fill="#6E8F6A" stroke="#ADD0A7" stroke-width="1" />
    <rect class="spine-bar" style="animation-delay: 0.14s" x="794" y="12" width="34" height="84" rx="4" fill="#DE8B4E" stroke="#FFB785" stroke-width="1" />
    <rect class="spine-bar" style="animation-delay: 0.26s" x="834" y="6" width="48" height="90" rx="4" fill="#C9963F" opacity="0.9" stroke="#F5BD62" stroke-width="1" />
    <rect class="spine-bar" style="animation-delay: 0.06s" x="888" y="14" width="28" height="82" rx="4" fill="#221F1D" stroke="#4F4537" stroke-width="1" />
    <rect class="spine-bar" style="animation-delay: 0.3s" x="922" y="2" width="52" height="94" rx="4" fill="#304E2E" stroke="#4F4537" stroke-width="1" />
    <rect class="spine-bar" style="animation-delay: 0.16s" x="980" y="8" width="40" height="88" rx="4" fill="#1D1B19" stroke="#4F4537" stroke-width="1" />

    <!-- Laser Scanning Ray Animation -->
    <g class="laser">
      <line x1="0" y1="-80" x2="1080" y2="-80" stroke="url(#laserGrad)" stroke-width="2.5" filter="url(#glow)" />
      <polygon points="0,-80 1080,-80 1080,-74 0,-74" fill="url(#laserGrad)" opacity="0.25" />
    </g>
  </g>

  <!-- Bottom Archival Status Bar -->
  <g transform="translate(60, 404)">
    <text x="0" y="10" fill="#A79C8C" font-size="11" class="mono">CONFIDENCE: [MATCHED 99% / REVIEW 1% / UNKNOWN 0%]</text>
    <text x="820" y="10" fill="#A79C8C" font-size="11" class="mono">DATA_PRIVACY: LOCAL_FIRST_100%</text>
  </g>
</svg>
