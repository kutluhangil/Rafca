<style>

            animation: pulse-border 2s infinite alternate ease-in-out;
        }
        @keyframes pulse-border {
            0% { border-color: rgba(201, 150, 63, 0.3); box-shadow: inset 0 0 10px rgba(201, 150, 63, 0.1); }

        }
        .scanning-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #f5bd62;
            box-shadow: 0 0 10px #f5bd62, 0 0 20px #f5bd62;
            animation: scan 3s linear infinite;
            z-index: 10;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .typing-text::after {
            content: '|';
            animation: blink 1s step-start infinite;

        @keyframes blink {

<script>
        // Simple script to update the typing text periodically to simulate processing phases
        const statusTexts = [
            "SEGMENTING 14 SPINES / EXTRACTING FEATURES",
            "READING TEXT / ENHANCING CONTRAST / OCR",
            "MATCHING / QUERYING ARCHIVE DATABASE",
            "ANALYZING TYPOGRAPHY / VERIFYING METADATA"
        ];
        
        let currentIndex = 0;
        const textElement = document.querySelector('.typing-text');
        
        setInterval(() => {
            currentIndex = (currentIndex + 1) % statusTexts.length;
            textElement.textContent = statusTexts[currentIndex];
        }, 4000);
    </script>
