<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Share Shelf - SPINE</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Literata:ital,wght@0,400;0,500;0,700;1,400&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#151311",
                        "primary-fixed": "#ffdeae",
                        "secondary-fixed": "#c8ecc1",
                        "on-secondary-fixed-variant": "#304e2e",
                        "inverse-primary": "#7f5700",
                        "surface": "#151311",
                        "error": "#ffb4ab",
                        "tertiary-fixed-dim": "#ffb785",
                        "surface-tint": "#f5bd62",
                        "outline-variant": "#4f4537",
                        "on-secondary-fixed": "#042107",
                        "surface-container-low": "#1d1b19",
                        "surface-container-lowest": "#100e0c",
                        "primary-container": "#c9963f",
                        "inverse-on-surface": "#33302d",
                        "on-tertiary": "#502400",
                        "on-tertiary-fixed-variant": "#723700",
                        "inverse-surface": "#e8e1dd",
                        "on-tertiary-fixed": "#301400",
                        "on-primary-fixed": "#281900",
                        "on-tertiary-container": "#582900",
                        "tertiary-container": "#de8b4e",
                        "tertiary-fixed": "#ffdcc6",
                        "tertiary": "#ffb785",
                        "secondary-fixed-dim": "#add0a7",
                        "surface-container": "#221f1d",
                        "on-secondary": "#19371a",
                        "on-surface-variant": "#d3c4b2",
                        "on-primary-fixed-variant": "#604100",
                        "surface-container-highest": "#373432",
                        "on-primary": "#432c00",
                        "surface-container-high": "#2c2927",
                        "surface-bright": "#3c3936",
                        "secondary-container": "#304e2e",
                        "on-secondary-container": "#9cbe96",
                        "primary-fixed-dim": "#f5bd62",
                        "primary": "#f5bd62",
                        "on-error": "#690005",
                        "outline": "#9c8f7e",
                        "on-background": "#e8e1dd",
                        "on-error-container": "#ffdad6",
                        "on-primary-container": "#4b3100",
                        "secondary": "#add0a7",
                        "background": "#151311",
                        "on-surface": "#e8e1dd",
                        "surface-variant": "#373432",
                        "error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "lg": "24px",
                        "base": "16px",
                        "md": "12px",
                        "xxl": "48px",
                        "sm": "8px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "display-lg": ["Literata"],
                        "label-mono": ["IBM Plex Mono"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Literata"],
                        "body-sm": ["Inter"],
                        "metadata-caps": ["IBM Plex Mono"],
                        "headline-md": ["Literata"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-mono": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["24px", { "lineHeight": "32px", "fontWeight": "500" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "metadata-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "headline-md": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .inner-glow {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-body-md overflow-hidden p-base sm:p-lg">
<!-- Main Canvas Area -->
<div class="relative w-full max-w-md h-auto flex flex-col pb-32">
<!-- Export Card (The Art Piece) -->
<div class="bg-surface rounded-xl border border-outline-variant inner-glow flex flex-col overflow-hidden shadow-2xl transition-transform duration-500 ease-out" id="export-card">
<!-- Top Section -->
<div class="p-xl flex flex-col items-center text-center space-y-md">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">42 Books</h1>
<p class="font-metadata-caps text-metadata-caps text-on-surface-variant tracking-[0.15em] uppercase">Autumn Collection</p>
</div>
<!-- The Shelf Strip (Signature Visual) -->
<div class="w-full h-48 flex bg-surface-container-lowest border-y border-outline-variant relative overflow-hidden">
<!-- Decorative lighting -->
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-[rgba(255,255,255,0.03)] to-transparent pointer-events-none"></div>
<!-- Individual Bars (Books) -->
<div class="flex-1 bg-[#2C251D] border-r border-[#3A332A] shadow-inner opacity-90"></div>
<div class="w-4 bg-[#8B2323] border-r border-[#3A332A] opacity-80"></div>
<div class="flex-[2] bg-[#1E262B] border-r border-[#3A332A] opacity-95"></div>
<div class="w-6 bg-[#C9963F] border-r border-[#3A332A] opacity-90"></div>
<div class="flex-[1.5] bg-[#3B4238] border-r border-[#3A332A] opacity-85"></div>
<div class="w-8 bg-[#1A1816] border-r border-[#3A332A] shadow-inner"></div>
<div class="flex-1 bg-[#4A3224] border-r border-[#3A332A] opacity-90"></div>
<div class="w-5 bg-[#D4CDA8] border-r border-[#3A332A] opacity-70"></div>
<div class="flex-[2.5] bg-[#222222] border-r border-[#3A332A] shadow-[inset_-2px_0_10px_rgba(0,0,0,0.5)]"></div>
<div class="w-3 bg-[#C9963F] border-r border-[#3A332A] opacity-100"></div>
<div class="flex-[1] bg-[#1C1916] border-r border-[#3A332A]"></div>
<div class="w-10 bg-[#521A1A] border-r border-[#3A332A] opacity-90"></div>
<div class="flex-[3] bg-[#2A2B2D] opacity-80"></div>
</div>
<!-- Bottom Section -->
<div class="p-xl flex flex-col items-center space-y-lg bg-surface">
<div class="font-label-mono text-label-mono text-on-surface text-center opacity-80 tracking-widest leading-relaxed">
                    POETRY / NOIR / HISTORY<br/>
<span class="text-on-surface-variant opacity-50">CAPTURED OCT 24</span>
</div>
<!-- Watermark -->
<div class="pt-lg border-t border-outline-variant w-1/2 flex justify-center">
<span class="font-headline-md text-headline-md text-primary opacity-40 tracking-widest">SPINE</span>
</div>
</div>
</div>
</div>
<!-- Material 3 Share Sheet (Bottom Sheet) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-high rounded-t-xl border-t border-outline-variant inner-glow z-50 transform translate-y-0 transition-transform duration-300">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-md pb-xs">
<div class="w-12 h-1 bg-outline-variant rounded-full opacity-50"></div>
</div>
<div class="px-lg pb-xxl pt-sm">
<div class="flex justify-between items-center mb-lg">
<h3 class="font-headline-sm text-headline-sm text-on-surface">Share Collection</h3>
<button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Share Actions Horizontal Scroll -->
<div class="flex space-x-lg overflow-x-auto pb-sm snap-x scrollbar-hide">
<!-- Save Image -->
<button class="flex flex-col items-center space-y-sm snap-start group min-w-[72px]">
<div class="w-14 h-14 rounded-full bg-surface-container border border-outline-variant flex items-center justify-center group-hover:bg-primary-container group-hover:text-surface transition-colors">
<span class="material-symbols-outlined">download</span>
</div>
<span class="font-label-mono text-label-mono text-on-surface-variant">Save</span>
</button>
<!-- Instagram (Generic placeholder) -->
<button class="flex flex-col items-center space-y-sm snap-start group min-w-[72px]">
<div class="w-14 h-14 rounded-full bg-surface-container border border-outline-variant flex items-center justify-center group-hover:bg-primary-container group-hover:text-surface transition-colors">
<span class="material-symbols-outlined">photo_camera</span>
</div>
<span class="font-label-mono text-label-mono text-on-surface-variant">Story</span>
</button>
<!-- Copy Link -->
<button class="flex flex-col items-center space-y-sm snap-start group min-w-[72px]">
<div class="w-14 h-14 rounded-full bg-surface-container border border-outline-variant flex items-center justify-center group-hover:bg-primary-container group-hover:text-surface transition-colors">
<span class="material-symbols-outlined">link</span>
</div>
<span class="font-label-mono text-label-mono text-on-surface-variant">Link</span>
</button>
<!-- Message -->
<button class="flex flex-col items-center space-y-sm snap-start group min-w-[72px]">
<div class="w-14 h-14 rounded-full bg-surface-container border border-outline-variant flex items-center justify-center group-hover:bg-primary-container group-hover:text-surface transition-colors">
<span class="material-symbols-outlined">chat</span>
</div>
<span class="font-label-mono text-label-mono text-on-surface-variant">Message</span>
</button>
</div>
</div>
</div>
<!-- Hide scrollbar for the share sheet -->
<style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script>
        // Subtle entry animation for the card
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.getElementById('export-card');
            card.style.transform = 'scale(0.95) translateY(20px)';
            card.style.opacity = '0';
            
            setTimeout(() => {
                card.style.transition = 'all 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
                card.style.transform = 'scale(1) translateY(0)';
                card.style.opacity = '1';
            }, 100);
        });
    </script>
</body></html>
