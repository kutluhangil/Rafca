                        "surface-container": "#221f1d",
                        "on-secondary": "#19371a",
                        "on-surface-variant": "#d3c4b2",
                        "on-primary-fixed-variant": "#604100",
                        "surface-container-highest": "#373432",
                        "on-primary": "#432c00",
                        "surface-container-high": "#2c2927",
                        "surface-bright": "#3c3936",
                        "secondary-container": "#304e2e",
                        "on-secondary-container": "#9cbe96",
                        "primary-fixed-dim": "#f5bd62",
                        "primary": "#f5bd62",
                        "on-error": "#690005",
                        "outline": "#9c8f7e",
                        "on-background": "#e8e1dd",
                        "on-error-container": "#ffdad6",
                        "on-primary-container": "#4b3100",
                        "secondary": "#add0a7",
                        "background": "#151311",
                        "on-surface": "#e8e1dd",
                        "surface-variant": "#373432",
                        "error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "lg": "24px",
                        "base": "16px",
                        "md": "12px",
                        "xxl": "48px",
                        "sm": "8px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "display-lg": ["Literata"],
                        "label-mono": ["IBM Plex Mono"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Literata"],
                        "body-sm": ["Inter"],
                        "metadata-caps": ["IBM Plex Mono"],
                        "headline-md": ["Literata"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-mono": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["24px", { "lineHeight": "32px", "fontWeight": "500" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "metadata-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "600" }],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden relative">
<!-- Viewfinder Background -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center z-0 object-cover opacity-80 mix-blend-luminosity" data-alt="A dimly lit, atmospheric live camera feed showing a wooden bookshelf filled with various old, leather-bound books. The lighting is soft and cinematic, highlighting the textures of the book spines in a quiet, private library setting at midnight." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBc4XLSNncgAUieXU5Uy5nePwI3U0rnDvC4msSukOsxo4go1FQ74gmaVNqeX7EZyXNJGqzECgqaLTQQ_RnAvS4WcKsJbNHZGCgoG4tG8yWoJpCgq0ZsU7QHxDU-JHo98eehfBPb4NIwhoI6gxkxssVWN5n3ZpbEq8YEdyA7iMcREY_yWokglCH76mYBfTphh0bV3AtHFt4gGeTY-9syFzV_SWvvkhhZAC34mracPpdC68Swjyx_bt-W')"></div>
<!-- UI Overlay Layer -->
<div class="absolute inset-0 z-10 flex flex-col justify-between p-lg pointer-events-none">
<!-- Top Actions & Hint -->
<div class="flex justify-between items-start w-full pointer-events-auto">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container/60 backdrop-blur-md border border-outline-variant/30 text-on-surface hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<!-- Hint Chip -->
<div class="bg-surface-container-high/80 backdrop-blur-md px-base py-sm rounded-full border border-outline-variant shadow-lg flex items-center gap-2 mt-sm">
<span class="material-symbols-outlined text-primary text-sm" data-icon="info">info</span>
<span class="font-body-sm text-body-sm text-on-surface">Hold parallel to the shelf</span>
</div>
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container/60 backdrop-blur-md border border-outline-variant/30 text-on-surface hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" data-icon="flash_off">flash_off</span>
</button>
</div>
<!-- Alignment Guide Frame -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-4/5 h-1/4 border border-primary/50 flex flex-col items-center justify-center pointer-events-none">
<!-- Corner Brackets -->
<div class="absolute -top-1 -left-1 w-4 h-4 border-t-2 border-l-2 border-primary"></div>
<div class="absolute -top-1 -right-1 w-4 h-4 border-t-2 border-r-2 border-primary"></div>
<div class="absolute -bottom-1 -left-1 w-4 h-4 border-b-2 border-l-2 border-primary"></div>
<div class="absolute -bottom-1 -right-1 w-4 h-4 border-b-2 border-r-2 border-primary"></div>
<!-- Level Indicator (Simulated active state) -->
<div class="w-full h-[1px] bg-primary/30 relative">
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-8 h-[2px] bg-primary"></div>
</div>
</div>
<!-- Bottom Controls -->
<div class="flex justify-between items-center w-full pointer-events-auto pb-xl">
<!-- Thumbnail -->
<div class="w-16 h-16 rounded-lg overflow-hidden border border-outline-variant relative">
<img class="w-full h-full object-cover" data-alt="A small thumbnail showing a previously captured image of a row of vintage books with worn leather spines, lit by a soft, warm light." src="https://lh3.googleusercontent.com/aida-public/AB6AXuARTH7uVRQDDuJu-tg2U2zvGCXoBQMZUfLdPDS1I01rxlAJPuDQDez6V2lDBS7LmtGEE-_oe1IVewLtoGLsFIOJ7hRDjqSY6cVwOuQrt5As9gSX-mehtr8240PrCRXvsCxhWFXTSR8Z8lj6Ys_5-oP_Q4oKAudZX6XrsC-ttrcukCp-or4ypfdWZNvsIsNcv9kdr_d5I5Kyq7oQOy872qVxOtfQo6RwI6k7bV6IBi07OqiLiUctoAxU"/>
</div>
<!-- Shutter Button -->
<button class="w-20 h-20 rounded-full bg-primary-container flex items-center justify-center border-4 border-surface-container-highest shadow-2xl active:scale-95 transition-transform">
<div class="w-16 h-16 rounded-full border border-surface-dim/30 flex items-center justify-center">
</div>
</button>
<!-- Spacer for balance -->
<div class="w-16 h-16"></div>
</div>
</div>
</body></html>
