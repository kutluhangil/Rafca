            color: theme('colors.on-background');

            box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.1);
        }

        .input-minimal {
            background: transparent;
            border: none;
            border-bottom: 1px solid theme('colors.outline-variant');
            transition: all 0.3s ease;
        }
        
        .input-minimal:focus {
            outline: none;
            border-bottom-color: theme('colors.primary-container');
            border-bottom-width: 2px;
            box-shadow: none;

<body class="min-h-screen flex flex-col font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-surface text-primary font-headline-md text-headline-md w-full top-0 sticky border-b border-outline-variant z-40 transition-colors duration-300 ease-in-out flex justify-between items-center px-lg h-16">
<button class="text-on-surface-variant hover:bg-surface-container-high transition-colors p-sm rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<span class="font-headline-md text-headline-md text-primary tracking-tight">SPINE</span>
<button class="text-on-surface-variant hover:bg-surface-container-high transition-colors p-sm rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>

</header>
<!-- Main Canvas -->
<main class="flex-grow w-full max-w-[1200px] mx-auto px-lg md:px-xl py-xl pb-32">
<!-- Search Section -->
<section class="mb-xxl max-w-2xl mx-auto w-full">
<div class="relative flex flex-col">
<label class="font-metadata-caps text-metadata-caps text-on-surface-variant mb-xs uppercase tracking-widest" for="manual-search">Search Library</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-on-surface-variant z-10 pointer-events-none" data-icon="search">search</span>
<input class="input-minimal w-full pl-lg py-sm text-on-surface font-body-lg text-body-lg placeholder-surface-variant bg-transparent" id="manual-search" placeholder="Title, Author, or ISBN" type="text" value="The City"/>
</div>
</div>
</section>
<!-- Results Section -->
<section class="w-full">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-lg">Search Results</h2>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-lg">
<!-- Book Card 1 -->
<article class="bg-[#1C1916] rounded-xl flex overflow-hidden border border-[#3A332A] book-card-glow hover:bg-surface-container transition-colors group cursor-pointer h-32">
<div class="w-24 shrink-0 bg-surface-container-lowest border-r border-[#3A332A]">
<img class="w-full h-full object-cover object-left opacity-90 group-hover:opacity-100 transition-opacity" data-alt="A vintage, minimalist book cover for 'The City We Became'. Dark brown and muted brass color palette. Tactile paper texture visible. Atmospheric, moody lighting emphasizing the texture of an old library book spine." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB7_nCdrCDMU9n-L-5VOSKrQPYnwR_WhVzRem0ER0ceWduk0bCdVAgbLe62cNhoE1NNKzBCxL_5V-VhCJlrhuPE070I-z4SJ_NV3LGPrTLOb9B07wV_GHme9HSrfLg9_MuBQLlrn11oQWhLLDz3CPigtW3s8zPgiN5tEQD_5TyX4xW2rt0bN_zFPwf10x9Kl_ZHmeZyP3KeNIqvPWJ5Z5Izi6ZWuXI6p6Votpq8D0OCgvOjCsUYPvlY"/>
</div>
<div class="p-md flex flex-col justify-between flex-grow">
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface leading-tight mb-xs truncate">The City We Became</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant truncate">N.K. Jemisin</p>
</div>
<div class="flex items-center justify-between mt-sm">
<span class="font-label-mono text-label-mono text-primary-container">ISBN 9780316556596</span>
<div class="flex items-center gap-xs">
<span class="w-1 h-3 bg-secondary-fixed"></span>
<span class="font-metadata-caps text-metadata-caps text-secondary-fixed">MATCHED</span>
</div>
</div>
</div>
</article>
<!-- Book Card 2 -->
<article class="bg-[#1C1916] rounded-xl flex overflow-hidden border border-[#3A332A] book-card-glow hover:bg-surface-container transition-colors group cursor-pointer h-32">

<img class="w-full h-full object-cover object-left opacity-90 group-hover:opacity-100 transition-opacity" data-alt="A dark, textured book spine of 'The City &amp; The City'. Subtle typography pressed into what looks like dark leather or heavy buckram cloth. Quiet, subdued library lighting. Minimalist design." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAGng7x5tH6ueArzsRcbZC1Kl4ZX5T60Z0C5pFTALmEXO-L0KrV_GflVu7rbSmwnleQZ7zfZgUBgsh-c0iXcbNvp3P5yo_MbPIUskNo2zKk3O6E4Ap4vNuv1T_Tnz4T-Q_oOcxZplJrjaLibtHVGhY9IrJoffQwcCasQk5CnItytMKXaisawgLtgsNN2t_8_3pfxQ5-h-IZVUlK2i-CNOFHAeYm001cvGvv9oxbhPepQ2JGuQgtLomt"/>
</div>
<div class="p-md flex flex-col justify-between flex-grow">
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface leading-tight mb-xs truncate">The City &amp; The City</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant truncate">China Miéville</p>
</div>
<div class="flex items-center justify-between mt-sm">

<div class="flex items-center gap-xs">
<span class="w-1 h-3 bg-primary-container"></span>
<span class="font-metadata-caps text-metadata-caps text-primary-container">REVIEW</span>

</div>
</div>
</article>
<!-- Book Card 3 -->
<article class="bg-[#1C1916] rounded-xl flex overflow-hidden border border-[#3A332A] book-card-glow hover:bg-surface-container transition-colors group cursor-pointer h-32">

</div>

<span class="font-label-mono text-label-mono sr-only">Search</span>

<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-70 scale-95 active:scale-90 transition-transform duration-200 hover:bg-surface-container-highest rounded-lg p-xs w-16">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-mono text-label-mono">Profile</span>
</button>

<script>
        // Simple micro-interaction for the search input
        const searchInput = document.getElementById('manual-search');
        if (searchInput) {
            searchInput.addEventListener('focus', () => {
                searchInput.parentElement.querySelector('.material-symbols-outlined').classList.replace('text-on-surface-variant', 'text-primary-container');
            });
            searchInput.addEventListener('blur', () => {
                searchInput.parentElement.querySelector('.material-symbols-outlined').classList.replace('text-primary-container', 'text-on-surface-variant');
            });
        }
    </script>
</body></html>
