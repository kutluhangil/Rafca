name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  # Pure Dart packages. No Flutter needed, so this stays fast and is what
  # gates the clustering algorithm the whole product rests on.
  dart:
    name: Dart packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [packages/spine_clustering, spike]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify generated sources are current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart' \
            || (echo "::error::Generated sources are stale. Run: cd app && dart run build_runner build --delete-conflicting-outputs" && exit 1)
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Verify performance budgets
        run: ../scripts/check_performance_budgets.sh
